<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thời gian thực · ViFoodRec</title>
<link rel="icon" href="img/placeholder-dish.svg">
<link rel="stylesheet" href="css/theme.css">
<script src="vendor/echarts.min.js"></script>
<script type="module" src="js/layout.js"></script>
<script type="module" src="js/thoi-gian-thuc.js"></script>
</head>
<body>
<div class="shell">
  <nav id="nav"></nav>
  <main class="main">
    <header class="page-head">
      <div>
        <p class="eyebrow">Thời gian thực</p>
        <h1>Món nào đang được nấu nhiều lúc này?</h1>
      </div>
      <div class="head-pills" id="head-pills"></div>
    </header>

    <section class="row">
      <article class="card" style="flex:1 1 320px">
        <div class="card-head"><h2>Trạng thái luồng</h2><span class="card-note">Spark Structured Streaming → MongoDB <code>trending</code></span></div>
        <div class="card-body" id="status"></div>
      </article>
      <article class="card" style="flex:2 1 520px">
        <div class="card-head"><h2>Lượt nấu theo cửa sổ</h2><span class="card-note">các cửa sổ gần nhất</span></div>
        <div class="card-body" id="windows"></div>
      </article>
    </section>

    <section class="row">
      <article class="card" style="flex:1 1 100%">
        <div class="card-head"><h2>Món thịnh hành</h2><span class="card-note" id="trend-note">cửa sổ gần nhất</span></div>
        <div class="card-body" id="trending"></div>
      </article>
    </section>
  </main>
</div>
</body>
</html>
